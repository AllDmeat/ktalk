name: Release

on:
  push:
    tags:
      - "*.*.*"

env:
  PRODUCT_NAME: ktalk

jobs:
  build:
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            bin-name: ktalk
            archive-suffix: darwin_arm64
            static-swift-stdlib: false
          - name: Linux x86_64
            os: ubuntu-latest
            bin-name: ktalk
            archive-suffix: linux_x86_64
            static-swift-stdlib: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            bin-name: ktalk
            archive-suffix: linux_arm64
            static-swift-stdlib: true
          # Windows is intentionally omitted: swift.org ships assertions-enabled
          # Windows toolchains that crash compiling TranscriptDialogue.dialogue()
          # under -c release, and the only Windows Swift install action
          # (compnerd/gha-setup-swift) cannot yet install the 6.3.x that fixes it.
          # Revisit when the action supports Swift 6.3+.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Stamp version from tag
        run: |
          # Inject the release version (the tag name, e.g. 1.0.0) into the SDK so
          # `ktalk --version` reports it. The committed source keeps a dev placeholder.
          sed -i.bak "s/public static let version = \"[^\"]*\"/public static let version = \"${GITHUB_REF_NAME}\"/" \
            Sources/KTalkSDK/KTalkSDK.swift
          rm -f Sources/KTalkSDK/KTalkSDK.swift.bak
          grep 'static let version' Sources/KTalkSDK/KTalkSDK.swift

      - name: Build release binary
        id: build
        run: |
          STATIC_FLAG=""
          if [ "${{ matrix.static-swift-stdlib }}" = "true" ]; then
            STATIC_FLAG="--static-swift-stdlib"
          fi
          # Release binaries ship no dSYMs, so skip debug-info generation for
          # smaller output (-gnone).
          BUILD_FLAGS="$STATIC_FLAG -Xswiftc -gnone"
          BIN_PATH="$(swift build -c release --product "$PRODUCT_NAME" $BUILD_FLAGS --show-bin-path)"
          swift build -c release --product "$PRODUCT_NAME" $BUILD_FLAGS
          echo "bin-path=$BIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Package binary
        id: package
        run: |
          ARCHIVE_NAME="${PRODUCT_NAME}_${GITHUB_REF_NAME}_${{ matrix.archive-suffix }}.tar.gz"
          BIN_PATH="${{ steps.build.outputs.bin-path }}"
          tar -czf "${ARCHIVE_NAME}" -C "${BIN_PATH}" "${{ matrix.bin-name }}"
          echo "archive-name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive-suffix }}
          path: ${{ steps.package.outputs.archive-name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package agent extension
        run: |
          # Ship agent/ as a self-contained archive (gemini-extension.json at the root) so
          # `gemini extensions install <repo-url>` can take it — Gemini can't install a subdir.
          tar -czf "${PRODUCT_NAME}_agent_${GITHUB_REF_NAME}.tar.gz" -C agent .

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            ${{ env.PRODUCT_NAME }}_agent_*.tar.gz
