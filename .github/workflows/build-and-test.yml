name: Build and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: ktalk

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            bin-name: ktalk
            archive-suffix: darwin_arm64
            static-swift-stdlib: false
          - name: Linux x86_64
            os: ubuntu-latest
            bin-name: ktalk
            archive-suffix: linux_x86_64
            static-swift-stdlib: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            bin-name: ktalk
            archive-suffix: linux_arm64
            static-swift-stdlib: true
          # Windows is intentionally omitted: swift.org ships assertions-enabled
          # Windows toolchains that crash compiling TranscriptDialogue.dialogue()
          # under -c release, and the only Windows Swift install action
          # (compnerd/gha-setup-swift) cannot yet install the 6.3.x that fixes it.
          # Revisit when the action supports Swift 6.3+.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Check every API operation has a CLI command
        run: scripts/check-cli-coverage.sh

      - name: Build release binary
        id: build
        run: |
          STATIC_FLAG=""
          if [ "${{ matrix.static-swift-stdlib }}" = "true" ]; then
            # --build-system native works around swift-build in Swift 6.4.0 failing to link
            # Foundation statically on Linux (swiftlang/swift-build#1764, fixed in 6.4.x by
            # swift-build#1770). Drop it once the pinned Swift includes that fix.
            STATIC_FLAG="--static-swift-stdlib --build-system native"
          fi
          BIN_PATH="$(swift build -c release --product "$PRODUCT_NAME" $STATIC_FLAG --show-bin-path)"
          swift build -c release --product "$PRODUCT_NAME" $STATIC_FLAG
          echo "bin-path=$BIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Package binary
        id: package
        run: |
          ARCHIVE_NAME="${PRODUCT_NAME}_pr${{ github.event.pull_request.number }}_${{ matrix.archive-suffix }}.tar.gz"
          BIN_PATH="${{ steps.build.outputs.bin-path }}"
          tar -czf "${ARCHIVE_NAME}" -C "${BIN_PATH}" "${{ matrix.bin-name }}"
          echo "archive-name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive-suffix }}
          path: ${{ steps.package.outputs.archive-name }}
          retention-days: 7
