name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
      - name: swift-format lint
        run: swift format lint --strict --recursive Sources/ Tests/

  no-internal-data:
    name: no-internal-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against leaked internal data
        run: scripts/check-no-internal-data.sh
